<p-menubar [model]="menuItems()">
  <ng-template pTemplate="start">
    <span class="text-xl font-bold mr-4">🍔 FoodOrder</span>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="flex align-items-center gap-3">
      <ng-container *ngIf="auth.isLoggedIn()">
        <div class="flex align-items-center gap-2">
          <p-avatar
            [label]="initials()"
            shape="circle"
            [style]="{ background: auth.isAdmin() ? '#6366f1' : '#10b981', color: '#fff', width:'32px', height:'32px', fontSize:'13px' }"
          ></p-avatar>
          <div class="flex flex-column" style="line-height:1.2">
            <span class="font-semibold text-sm">{{ auth.currentUser()?.fullName }}</span>
            <p-tag
              [value]="auth.currentUser()?.role ?? ''"
              [severity]="auth.isAdmin() ? 'warning' : 'info'"
              styleClass="text-xs"
            ></p-tag>
          </div>
        </div>
        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="auth.logout()"
        ></p-button>
      </ng-container>
    </div>
  </ng-template>
</p-menubar>

<router-outlet />
