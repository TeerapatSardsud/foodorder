<p-menubar [model]="menuItems()">
  <ng-template pTemplate="start">
    <span class="text-xl font-bold mr-4">🍔 FoodOrder</span>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="flex align-items-center gap-3">
      <a routerLink="/checkout" class="p-button p-button-text p-button-rounded relative"
         style="text-decoration:none">
        <i class="pi pi-shopping-cart text-xl"></i>
        <span *ngIf="(cartCount$ | async)! > 0"
          class="p-badge p-badge-danger"
          style="position:absolute;top:-4px;right:-4px;font-size:10px;min-width:18px;height:18px;line-height:18px">
          {{ cartCount$ | async }}
        </span>
      </a>
      <ng-container *ngIf="authService.isLoggedIn()">
        <div class="flex align-items-center gap-2">
          <p-avatar
            [label]="initials()"
            shape="circle"
            [style]="{ background: authService.isAdmin() ? '#6366f1' : '#10b981', color: '#fff', width:'32px', height:'32px', fontSize:'13px' }"
          ></p-avatar>
          <div class="flex flex-column" style="line-height:1.2">
            <span class="font-semibold text-sm">{{ authService.currentUser()?.fullName }}</span>
            <p-tag
              [value]="authService.currentUser()?.role ?? ''"
              [severity]="authService.isAdmin() ? 'warning' : 'info'"
              styleClass="text-xs"
            ></p-tag>
          </div>
        </div>
        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="authService.logout()"
        ></p-button>
      </ng-container>
    </div>
  </ng-template>
</p-menubar>

<router-outlet />
